# Visual style: docs/gui.md → Visual style (D-024). Greyscale UI, square corners,
# Arial-like sans-serif at 12 pt body / 14 pt bold headers.
[theme]
base = "light"
primaryColor = "#333333"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f2f2"
textColor = "#1a1a1a"
borderColor = "#c8c8c8"
font = "Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif"
headingFont = "Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["18.67px", "18.67px", "16px", "16px", "16px", "16px"]
headingFontWeights = 700
baseRadius = "none"

[server]
# Serves ./static at app/static/: plotly.js for the results figure (D-060).
enableStaticServing = true
runOnSave = true
# Keep a disconnected browser session (laptop asleep, network drop) for 12 h
# instead of 2 min, so coming back resumes the session (D-040).
disconnectedSessionTTL = 43200

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tariff editor</title>
  <style>
    /* docs/gui.md: greyscale structure, square corners, Arial-like 12 pt */
    html, body { margin: 0; padding: 0; background: #fff; color: #1a1a1a;
      font-family: Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif; font-size: 14px; }
    * { border-radius: 0 !important; box-sizing: border-box; }
    .hint { color: #555; font-size: 13px; margin: 2px 0 8px; }
    table.rates { border-collapse: collapse; margin-bottom: 6px; }
    table.rates th { font-weight: 400; color: #555; font-size: 13px; text-align: left; padding: 0 6px 2px 0; }
    table.rates td { padding: 2px 6px 2px 0; }
    /* Half a swatch width of space on the left so the selection outline isn't clipped. */
    table.rates td:first-child, table.rates th:first-child { padding-left: 17px; }
    .swatch { width: 34px; height: 26px; border: 1px solid #8a8a8a; cursor: pointer; display: block; }
    .swatch.active { outline: 3px solid #1a1a1a; outline-offset: 1px; }
    input { font: inherit; border: 1px solid #c8c8c8; padding: 3px 5px; background: #f2f2f2; }
    input.name { width: 150px; } input.num { width: 90px; text-align: right; }
    button { font: inherit; border: 1px solid #c8c8c8; background: #fff; padding: 3px 10px; cursor: pointer; }
    button:hover { border-color: #1a1a1a; }
    button.del { padding: 3px 8px; color: #555; }
    table.grid { border-collapse: collapse; user-select: none; table-layout: fixed; width: 100%; margin-top: 8px; }
    table.grid th { font-weight: 400; font-size: 11px; color: #555; padding: 1px 0; cursor: pointer; }
    table.grid th.corner { cursor: default; width: 34px; }
    table.grid th.month { text-align: left; padding-right: 4px; }
    table.grid th:hover:not(.corner) { color: #1a1a1a; text-decoration: underline; }
    table.grid td { height: 20px; border: 1px solid #fff; cursor: crosshair; padding: 0; }
  </style>
</head>
<body>
  <div class="hint">Click a colour swatch to pick a rate, then click or drag over the table to paint it
    (click a month or hour heading to paint the whole row or column).</div>
  <table class="rates"><thead><tr>
    <th></th><th>Rate</th><th>Energy ($/kWh)</th><th>Demand ($/kW)</th><th></th>
  </tr></thead><tbody id="rates"></tbody></table>
  <button id="add">+ Add rate</button>
  <table class="grid" id="grid"></table>
  <script src="main.js"></script>
</body>
</html>
